
services:
  microservicenet9.basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #Default is Production
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
      - ConnectionStrings:Redis=redis.db.basket:6379,password=Password12
    ports:
      - "8080"


  microservicenet9.catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
      - MongoOptions:ConnectionString=mongodb://myuser:Password12@mongo.db.catalog:27017
    ports:
      - "8080"


  microservicenet9.discount.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
      - MongoOptions:ConnectionString=mongodb://myuser:Password12@mongo.db.discount:27017
      # - ASPNETCORE_HTTPS_PORTS=8081 HTTPS not used in dev environment
    ports:
      - "8080"
      # - "8081" HTTPS not used in dev environment
    # volumes:
    #   - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
    #   - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    #   - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
    #   - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  microservicenet9.file.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
    ports:
      - "8080"


  microservicenet9.gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
    ports:
      - "8080"


  microservicenet9.order.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
      - AddressUrlOption:PaymentUrl=http://microservicenet9.payment.api:8080
      - ConnectionStrings:SqlServer=Server=sqlserver.db.order,1433;Database=OrderDb;User=Sa;Password=Password12*;Trusted_Connection=False;TrustServerCertificate=True;Integrated Security=False
    ports:
      - "8080"


  microservicenet9.payment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BusOption:Address=rabbitmq
      - BusOption:Port=5672
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:Issuer=http://keycloak:8080/realms/microserviceTenant
    ports:
      - "8080"


  microservicenet9.web:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IdentityOption:AdminAddress=http://keycloak:8080/admin/realms/microserviceTenant
      - IdentityOption:Address=http://keycloak:8080/realms/microserviceTenant
      - IdentityOption:BaseAddress=http://keycloak:8080
      - GatewayOption:BaseAddress=http://microservicenet9.gateway:8080
      - MicroserviceOption:Catalog:BaseAddress=http://microservicenet9.catalog.api:8080
      - MicroserviceOption:File:BaseAddress=http://microservicenet9.file.api:8080
      - MicroserviceOption:Basket:BaseAddress=http://microservicenet9.basket.api:8080
      - MicroserviceOption:Discount:BaseAddress=http://microservicenet9.discount.api:8080
      - MicroserviceOption:Order:BaseAddress=http://microservicenet9.order.api:8080
    ports:
      - "5050:8080" # Expose web app on port 5050

